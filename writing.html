<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing — My Site</title>
  <meta name="description" content="Writings, published automatically from Notion.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Libre Baskerville', Georgia, serif; color: #1a1a1a; background: #fdfcf9; margin: 0; line-height: 1.7; }
    main { max-width: 640px; margin: 0 auto; padding: 12vh 28px; }
    .writing-title { font-size: 1.6rem; margin: 0 0 1.4em; }
    .entry { margin: 0 0 1.6em; }
    .entry-title { display: block; font-size: 1.05rem; color: #1a1a1a; text-decoration: none; }
    .entry-title:hover { text-decoration: underline; }
    .entry-meta { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8a8a; margin-top: 0.25em; }
    .entry-desc { font-size: 0.92rem; color: #555; margin-top: 0.3em; }
    .empty { color: #8a8a8a; font-size: 0.92rem; }
    nav.back { margin-top: 3em; font-size: 0.85rem; }
    nav.back a { text-decoration: none; color: #595959; }
    nav.back a:hover { color: #1a1a1a; }
  </style>
</head>
<body>
  <main>
    <div class="writing-title">Writing</div>

    <!-- The sync injects and maintains the list of pieces right here, between
         its own markers, on the first run. Nothing to edit by hand. Until you
         connect Notion (see scripts/notion-sync/TUTORIAL.md), it stays empty. -->
    <p class="empty">Nothing published yet — connect Notion to fill this in.</p>

    <nav class="back"><a href="index.html">← home</a></nav>
  </main>
</body>
</html>
